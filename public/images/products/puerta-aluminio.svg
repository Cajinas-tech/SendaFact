<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="alu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Background glow -->
  <rect width="400" height="500" fill="#f8fafc" rx="16"/>
  <!-- Door frame 3D perspective -->
  <g transform="translate(60, 40)">
    <!-- Outer frame -->
    <rect x="20" y="20" width="180" height="400" fill="url(#alu)" stroke="#64748b" stroke-width="4" rx="4"/>
    <rect x="35" y="35" width="150" height="180" fill="url(#glass)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="35" y="235" width="150" height="170" fill="url(#glass)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Glass reflection line -->
    <line x1="45" y1="45" x2="175" y2="205" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
    <line x1="45" y1="245" x2="175" y2="395" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
    <!-- Center divider and lock/handle -->
    <rect x="20" y="215" width="180" height="20" fill="url(#alu)" stroke="#64748b" stroke-width="2"/>
    <rect x="180" y="200" width="12" height="40" fill="#1e293b" rx="3"/>
    <!-- Dimension annotations -->
    <!-- Height arrow right -->
    <line x1="230" y1="20" x2="230" y2="420" stroke="#0f172a" stroke-width="2"/>
    <polygon points="230,15 225,25 235,25" fill="#0f172a"/>
    <polygon points="230,425 225,415 235,415" fill="#0f172a"/>
    <text x="245" y="225" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">2.10 m</text>
  </g>
</svg>