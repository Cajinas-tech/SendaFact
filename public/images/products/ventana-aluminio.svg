<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="win-alu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="win-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cffafe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" fill="#f8fafc" rx="16"/>
  <g transform="translate(30, 30)">
    <!-- 3D Window Frame -->
    <rect x="20" y="20" width="380" height="220" fill="url(#win-alu)" stroke="#475569" stroke-width="4" rx="4"/>
    <!-- 3 Panes -->
    <rect x="35" y="35" width="110" height="190" fill="url(#win-glass)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="155" y="35" width="110" height="190" fill="url(#win-glass)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="275" y="35" width="110" height="190" fill="url(#win-glass)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Glass reflections -->
    <line x1="45" y1="45" x2="135" y2="215" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
    <line x1="165" y1="45" x2="255" y2="215" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
    <line x1="285" y1="45" x2="375" y2="215" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
    <!-- Dimension arrows -->
    <!-- Width arrow below -->
    <line x1="20" y1="260" x2="400" y2="260" stroke="#0f172a" stroke-width="2"/>
    <polygon points="15,260 25,255 25,265" fill="#0f172a"/>
    <polygon points="405,260 395,255 395,265" fill="#0f172a"/>
    <text x="190" y="280" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">1.80 m</text>
    <!-- Depth & Height annotation -->
    <line x1="420" y1="20" x2="420" y2="240" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="420,15 416,25 424,25" fill="#0f172a"/>
    <polygon points="420,245 416,235 424,235" fill="#0f172a"/>
    <text x="430" y="130" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">1.20 m</text>
    <text x="410" y="280" font-family="sans-serif" font-size="11" font-bold fill="#64748b">5.71 cm</text>
  </g>
</svg>